[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
mosaix-core = { path = "crates/mosaix-core" }
mosaix-gpu = { path = "crates/mosaix-gpu" }
mosaix-io = { path = "crates/mosaix-io" }
mosaix-raw = { path = "crates/mosaix-raw" }
mosaix-vector = { path = "crates/mosaix-vector" }
wgpu = "30"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
moxcms = { version = "0.8", features = ["extended_range"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "exr", "rayon", "avif", "avif-native"] }
half = { version = "2", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
pollster = "1"
rayon = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"
tempfile = "3"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-tracy = "0.12"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }

[profile.dev.package."*"]
opt-level = 3

# Pixel loops (fill, heal) are unusably slow unoptimised, also in tests.
[profile.dev.package.mosaix-core]
opt-level = 2

[profile.dev.package.mosaix-gpu]
opt-level = 2

[profile.dev.package.mosaix-vector]
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "thin"
